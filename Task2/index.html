<!-- second project: Task 2: Styling a Product Card-->
<!-- Description:
Design a product card using HTML and CSS.Include an image, product name, price, and an "Add to Cart" button. Style the card with CSS to ensure proper 
alignment and add hover effects to the button for a polished look-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #ffffff;
            width: 300px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            padding: 16px;
        }

        .card img {
            width: 100%;
            height: ;
            object-fit: cover;
            border-radius: 4px;
        }

        .card h3 {
            margin: 12px 0 8px 0;
            color: #333333;
        }

        .price {
            font-size: 18px;
            color: #2b7a78;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .btn {
            background-color: #3a506b;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #1c2541;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://www.picclickimg.com/4gYAAOSwIbNlCXIy/soundcoreQ20i-Hybrid-Active-Noise-Cancelling-Foldable-Headphones-Big.webp" 		alt="Wireless Headphones">
        <h3>Wireless Headphones</h3>
        <div class="price">$49.99</div>
        <button class="btn">Add to Cart</button>
    </div>

</body>
</html>
